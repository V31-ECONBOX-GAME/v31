apiVersion: apps/v1
kind: Deployment
metadata:
  name: v31-compliance-service
  namespace: v31
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v31-compliance-service
  template:
    metadata:
      labels:
        app: v31-compliance-service
    spec:
      # Created by `kubectl create secret docker-registry`; see README.md.
      imagePullSecrets:
        - name: harbor
      # Flyway fails fast on a refused connection, so wait rather than crash-loop.
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: v31-compliance-service
          image: harbor.local:80/v31/v31-compliance-service:0.2.0-SNAPSHOT
          # The snapshot tag is overwritten on every push, so never serve a cached layer set.
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/v31
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          startupProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: v31-compliance-service
  namespace: v31
spec:
  selector:
    app: v31-compliance-service
  ports:
    - port: 8084
      targetPort: 8084

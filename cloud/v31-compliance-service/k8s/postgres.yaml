# Local-only credentials; a real environment takes these from a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: v31
type: Opaque
stringData:
  POSTGRES_DB: v31
  POSTGRES_USER: v31
  POSTGRES_PASSWORD: v31
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: v31
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: v31
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          envFrom:
            - secretRef:
                name: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            # PGDATA is /var/lib/postgresql/18/docker, the declared volume its parent.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "v31", "-d", "v31"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

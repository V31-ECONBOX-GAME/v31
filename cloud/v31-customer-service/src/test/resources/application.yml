# The datasource comes from a throwaway PostgreSQL container, so a test run
# never touches a database anyone else is using. See PostgresContainerConfiguration.
spring:
  application:
    name: v31-customer-service-it
  jackson:
    default-property-inclusion: non_null
  flyway:
    schemas: customer
    default-schema: customer
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: customer

logging:
  level:
    org.v31bank: INFO
    org.hibernate.SQL: WARN

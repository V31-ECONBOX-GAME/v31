# The datasource comes from a throwaway PostgreSQL container, so a test run
# never touches a database anyone else is using. See PostgresContainerConfiguration.
spring:
  application:
    name: v31-transfer-service-it
  jackson:
    default-property-inclusion: non_null
  flyway:
    schemas: transfer
    default-schema: transfer
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: transfer

logging:
  level:
    org.v31bank: INFO
    org.hibernate.SQL: WARN

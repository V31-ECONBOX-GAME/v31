base:
- _base/node.yaml
- template:docker-rootful
cpus: 4
memory: 4GiB
disk: 100GiB
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
param:
  ip: 10.10.0.60
  containerdSnapshotter: false
provision:
- mode: dependency
  script: |
    #!/bin/sh
    set -eu
    systemctl disable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer
    [ "$(dpkg-query -W -f='${Version}' docker-ce 2>/dev/null)" = "5:28.0.4-1~ubuntu.24.04~noble" ] && exit 0
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    cat >/etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: noble
    Components: stable
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends \
      docker-ce=5:28.0.4-1~ubuntu.24.04~noble \
      docker-ce-cli=5:28.0.4-1~ubuntu.24.04~noble \
      containerd.io=2.4.2-1~ubuntu.24.04~noble
    apt-mark hold docker-ce docker-ce-cli containerd.io
- mode: system
  script: |
    #!/bin/sh
    set -eu
    cat >/tmp/daemon.json <<EOF
    {
      "features": {
        "cdi": true,
        "containerd-snapshotter": {{.Param.containerdSnapshotter}}
      },
      "log-driver": "json-file",
      "log-opts": {
        "max-size": "20m",
        "max-file": "5",
        "compress": "true"
      },
      "builder": {
        "gc": {
          "enabled": true,
          "defaultMaxUsedSpace": "20GB"
        }
      },
      "bip": "10.250.0.1/24",
      "default-address-pools": [
        {
          "base": "10.251.0.0/20",
          "size": 24
        },
        {
          "base": "10.251.16.0/21",
          "size": 24
        },
        {
          "base": "10.251.24.0/22",
          "size": 24
        },
        {
          "base": "10.251.28.0/23",
          "size": 24
        }
      ],
      "live-restore": true
    }
    EOF
    cmp -s /tmp/daemon.json /etc/docker/daemon.json && exit 0
    install -m 644 /tmp/daemon.json /etc/docker/daemon.json
    systemctl daemon-reload
    systemctl restart docker.socket docker.service

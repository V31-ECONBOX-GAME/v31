base:
- _base/node.yaml
- template:_default/mounts
cpus: 2
memory: 4GiB
disk: 20GiB
additionalDisks:
- name: docker-data
  fsType: ext4
portForwards:
- guestPort: 1080
  hostIP: 0.0.0.0
  proto: any
- guestSocket: /var/run/docker.sock
  hostSocket: "{{.Dir}}/sock/docker.sock"
hostResolver:
  hosts:
    host.docker.internal: host.lima.internal
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
param:
  ip: 10.10.0.60
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    mountpoint -q /data && exit 0
    grep -q ' /data ' /etc/fstab || echo 'LABEL=lima-docker-data /data ext4 defaults,noatime,nofail,x-systemd.device-timeout=10s 0 2' >>/etc/fstab
    install -d /data
    systemctl daemon-reload
    mount /data
- mode: system
  script: |
    #!/bin/sh
    set -eu
    sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
    cat >/tmp/override.conf <<EOF
    [Socket]
    SocketUser={{.User}}
    EOF
    cat >/tmp/docker.service.conf <<EOF
    [Unit]
    RequiresMountsFor=/data
    ConditionPathIsMountPoint=/data
    EOF
    cat >/tmp/daemon.json <<EOF
    {
      "data-root": "/data/docker",
      "features": {
        "cdi": true
      },
      "log-driver": "json-file",
      "log-opts": {
        "max-size": "20m",
        "max-file": "5",
        "compress": "true"
      },
      "builder": {
        "gc": {
          "enabled": true,
          "defaultMaxUsedSpace": "5GB"
        }
      },
      "bip": "10.250.0.1/24",
      "default-address-pools": [
        {
          "base": "10.251.0.0/20",
          "size": 24
        },
        {
          "base": "10.251.16.0/21",
          "size": 24
        },
        {
          "base": "10.251.24.0/22",
          "size": 24
        },
        {
          "base": "10.251.28.0/23",
          "size": 24
        }
      ],
      "ip-forward-no-drop": true,
      "live-restore": true
    }
    EOF
    cmp -s /tmp/override.conf /etc/systemd/system/docker.socket.d/override.conf &&
      cmp -s /tmp/docker.service.conf /etc/systemd/system/docker.service.d/override.conf &&
      cmp -s /tmp/daemon.json /etc/docker/daemon.json &&
      exit 0
    install -d /etc/docker /etc/systemd/system/docker.socket.d /etc/systemd/system/docker.service.d
    install -m 644 /tmp/override.conf /etc/systemd/system/docker.socket.d/override.conf
    install -m 644 /tmp/docker.service.conf /etc/systemd/system/docker.service.d/override.conf
    install -m 644 /tmp/daemon.json /etc/docker/daemon.json
    command -v dockerd >/dev/null || exit 0
    systemctl daemon-reload
    systemctl restart docker.socket docker.service
- mode: system
  script: |
    #!/bin/sh
    set -eu
    [ "$(dpkg-query -W -f='${Version}' docker-ce 2>/dev/null)" = "5:28.0.4-1~ubuntu.24.04~noble" ] && exit 0
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    cat >/etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: noble
    Components: stable
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends \
      docker-ce=5:28.0.4-1~ubuntu.24.04~noble \
      docker-ce-cli=5:28.0.4-1~ubuntu.24.04~noble \
      containerd.io=2.4.2-1~ubuntu.24.04~noble \
      docker-compose-plugin=5.6.0-1~ubuntu.24.04~noble
    apt-mark hold docker-ce docker-ce-cli containerd.io docker-compose-plugin

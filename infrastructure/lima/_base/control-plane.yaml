base: node.yaml
cpus: 2
memory: 4GiB
disk: 20GiB
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    n={{.Name}}
    mountpoint -q /var/lib/etcd && exit 0
    grep -q ' /var/lib/etcd ' /etc/fstab || echo "LABEL=lima-cp${n#control-plane}-etcd /var/lib/etcd ext4 defaults,noatime,nofail,x-systemd.device-timeout=10s 0 2" >>/etc/fstab
    install -d /var/lib/etcd
    systemctl daemon-reload
    mount /var/lib/etcd
    chmod 700 /var/lib/etcd
    if [ -e /etc/systemd/system/etcd.service ]; then
      systemctl start --no-block etcd.service
    fi
- mode: system
  script: |
    #!/bin/sh
    set -eu
    cat >/tmp/etcd.service.conf <<EOF
    [Unit]
    RequiresMountsFor=/var/lib/etcd
    ConditionPathIsMountPoint=/var/lib/etcd
    EOF
    cmp -s /tmp/etcd.service.conf /etc/systemd/system/etcd.service.d/override.conf && exit 0
    install -d /etc/systemd/system/etcd.service.d
    install -m 644 /tmp/etcd.service.conf /etc/systemd/system/etcd.service.d/override.conf
    systemctl daemon-reload
- mode: system
  script: |
    #!/bin/sh
    set -eu
    cat >/tmp/kube-apiserver-vip <<'EOF'
    #!/bin/sh
    set -u
    vip=10.200.0.1/32
    failures=0
    while :; do
      if curl -fsk --max-time 15 https://{{.Param.ip}}:6443/readyz >/dev/null; then
        failures=0
        ip -o address show dev lo | grep -q "$vip" || ip address add "$vip" dev lo
      else
        failures=$((failures + 1))
        [ "$failures" -lt 3 ] || ip address del "$vip" dev lo 2>/dev/null || true
      fi
      sleep 1
    done
    EOF
    cat >/tmp/kube-apiserver-vip.service <<'EOF'
    [Unit]
    Description=kube-apiserver VIP

    [Service]
    ExecStart=/usr/local/sbin/kube-apiserver-vip
    ExecStopPost=-/usr/sbin/ip address del 10.200.0.1/32 dev lo
    Restart=always
    RestartSec=1

    [Install]
    WantedBy=multi-user.target
    EOF
    cmp -s /tmp/kube-apiserver-vip /usr/local/sbin/kube-apiserver-vip &&
      cmp -s /tmp/kube-apiserver-vip.service /etc/systemd/system/kube-apiserver-vip.service &&
      exit 0
    install -m 755 /tmp/kube-apiserver-vip /usr/local/sbin/kube-apiserver-vip
    install -m 644 /tmp/kube-apiserver-vip.service /etc/systemd/system/kube-apiserver-vip.service
    systemctl daemon-reload
    systemctl enable kube-apiserver-vip.service
    systemctl restart kube-apiserver-vip.service

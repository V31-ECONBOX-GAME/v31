cilium_kube_proxy_replacement: true
cilium_tunnel_mode: disabled
cilium_auto_direct_node_routes: true
cilium_native_routing_cidr: 10.233.64.0/18
cilium_extra_values:
  devices: lima0
  loadBalancer:
    algorithm: maglev
cilium_loadbalancer_mode: dsr
cilium_enable_bgp_control_plane: true
cilium_loadbalancer_ip_pools:
  - name: svc-lb
    ranges:
      - start: 10.200.0.1
        stop: 10.200.0.254
cilium_bgp_cluster_configs:
  - name: svc-lb
    spec:
      nodeSelector:
        matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
      bgpInstances:
        - name: svc-lb
          localASN: 64513
          peers:
            - name: kube-frr
              peerASN: 64512
              peerAddress: 10.10.0.60
              peerConfigRef:
                name: kube-frr
cilium_bgp_peer_configs:
  - name: kube-frr
    spec:
      timers:
        connectRetryTimeSeconds: 10
        holdTimeSeconds: 9
        keepAliveTimeSeconds: 3
      families:
        - afi: ipv4
          safi: unicast
          advertisements:
            matchLabels:
              advertisement: svc-lb
cilium_bgp_advertisements:
  - name: svc-lb
    labels:
      advertisement: svc-lb
    spec:
      advertisements:
        - advertisementType: Service
          service:
            addresses:
              - LoadBalancerIP
          selector: {}

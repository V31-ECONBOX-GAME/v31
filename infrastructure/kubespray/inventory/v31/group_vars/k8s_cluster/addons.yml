---
# Only metrics-server is enabled. Everything the V31 stack needs above the cluster is
# owned by the Istio and kube-vip tracks, not by Kubespray addons.
#
# ingress-nginx is deliberately absent rather than set false: v2.32.0 no longer
# carries that role at all, so ingress_nginx_enabled would be dead config. Istio
# Gateway serves north-south traffic anyway.

metrics_server_enabled: true

# kube-vip provides both the control-plane VIP and service load balancing.
metallb_enabled: false
ingress_alb_enabled: false

# Left to the Istio track. Kubespray v2.32.0 would install Gateway API 1.6.2
# Left to the Istio track so one file owns the CRD version and the install order
# (CRDs before istiod). Kubespray v2.32.0 would install v1.6.2, which happens to be
# exactly what istio/versions.yml pins today - but a Kubespray bump would move it
# silently, and waypoints are Gateway API resources that must match the Istio release.
gateway_api_enabled: false

helm_enabled: false
registry_enabled: false
cert_manager_enabled: false
argocd_enabled: false
node_feature_discovery_enabled: false
local_path_provisioner_enabled: false
local_volume_provisioner_enabled: false
csi_snapshot_controller_enabled: false

# Off. Kubespray defaults it to true whenever dns_mode is coredns, so it would
# deploy cluster-proportional-autoscaler as a third taint-tolerating pod on the
# 2 vCPU control planes. coredns_replicas already fixes the replica count at the
# value the autoscaler would pick for a cluster this size.
enable_dns_autoscaler: false

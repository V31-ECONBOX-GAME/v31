---
# kube-vip: highly-available virtual IP for the Kubernetes control plane.
# Layer 2 / ARP mode with leader election across cp1, cp2, cp3.
#
# Read by the Kubespray role kubernetes/node (tasks/loadbalancer/kube-vip.yml),
# which renders /etc/kubernetes/manifests/kube-vip.yml on kube_control_plane hosts
# only. Verified against Kubespray v2.32.0 and kube-vip v1.2.4.
#
# Depends on two variables owned elsewhere in this inventory:
#   kube_vip_address                       group_vars/all/all.yml
#   kube_proxy_mode, kube_proxy_strict_arp group_vars/k8s_cluster/k8s-cluster.yml
# The role asserts strict_arp when kube_proxy_mode is ipvs; this cluster uses
# iptables, so the assertion does not fire either way.

kube_vip_enabled: true
kube_vip_controlplane_enabled: true

# Kubespray v2.32.0 defaults to 1.0.3 (2025-12). 1.2.4 publishes linux/arm64 and
# carries the ARP-mode and control-plane leader-election fixes from the 1.2.x line.
# Safe override: every env var the Kubespray template emits exists in 1.2.4.
kube_vip_version: 1.2.4

# ARP mode. The segment is a Linux bridge inside OrbStack, so gratuitous ARP
# reaches every node and the macOS host; measured failover was lossless.
kube_vip_arp_enabled: true
kube_vip_bgp_enabled: false

# eth0 is a veth on every node. There is no second NIC to separate service traffic.
kube_vip_interface: eth0
kube_vip_services_interface: eth0

# /32 host route for the VIP; the nodes already carry 192.168.139.0/24 on eth0.
kube_vip_cidr: 32

# Leader election owns the VIP. 15/10/2 are kube-vip's own client-go-aligned
# defaults, not Kubespray's 5/3/1: the control planes have 2 vCPU and share a
# macOS host, so a 3s renew deadline invites spurious leadership loss and VIP
# flapping. The cost is a slower worst-case failover.
kube_vip_leader_election_enabled: true
kube_vip_leasename: plndr-cp-lock
kube_vip_leaseduration: 15
kube_vip_renewdeadline: 10
kube_vip_retryperiod: 2

# false keeps the deterministic bootstrap path: kube-vip rewrites the API host to
# "kubernetes:6443" and the static pod's hostAliases maps that to 127.0.0.1, so it
# talks to the local apiserver and never needs the VIP it has not created yet.
# true switches to loopback autodetection, which returns an error instead of
# retrying when the local apiserver is not yet serving TLS.
kube_vip_cp_detect: false
kube_vip_ddns_enabled: false

# false: the VIP is pinned to the leader and that node's apiserver serves all API
# traffic. true would start a second IPVS consumer beside kube-proxy on a 2 vCPU
# node for no benefit at this cluster size.
kube_vip_lb_enable: false
# Also selects the image: "masquerade" appends -iptables to the repo, and kube-vip's
# v1.1.0 notes announced that image is removed in the 1.2.x line. Do not switch this
# without also moving kube_vip_version back.
kube_vip_lb_fwdmethod: local

# Service-type LoadBalancer, so the Istio Gateway gets a real external address.
# No kube-vip cloud provider is deployed: the Gateway Service carries a
# kube-vip.io/loadbalancerIPs annotation and kube-vip writes
# status.loadBalancer.ingress itself. See manifests/kube-vip/address-allocation.yaml.
#
# Election stays off so one lease and one leader own both the API VIP and every
# service VIP: a single failover story. Service VIPs can therefore only live on
# cp1/cp2/cp3, because Kubespray writes the static pod nowhere else - the Gateway
# Service must stay externalTrafficPolicy: Cluster so kube-proxy can forward from
# the VIP holder to gateway pods on the workers.
kube_vip_services_enabled: true
kube_vip_enableServicesElection: false
kube_vip_svc_leasename: plndr-svcs-lock

# Labels the leader kube-vip.io/has-ip=<vip>, so the holder is a kubectl query.
kube_vip_enable_node_labeling: true
kube_vip_metrics_enabled: true
kube_vip_metrics_port: 2112

# Repoints kubeadm's controlPlaneEndpoint, every kubeconfig and the worker apiserver
# endpoint at the VIP, adds it to the apiserver certSANs, and suppresses the
# per-node localhost nginx proxy. A single-pass install works; docs/kube-vip.md
# traces why, and gives the two-pass fallback.
loadbalancer_apiserver:
  address: "{{ kube_vip_address }}"
  port: 6443

---
# Stacked etcd on the three control-plane nodes.
#
# Stated explicitly because the swap handling depends on it: Kubespray runs etcd as
# a host systemd service, not a static pod, so kubelet_swap_behavior: NoSwap does
# not cover it. playbooks/orbstack-prepare.yml installs a MemorySwapMax=0 drop-in
# for etcd.service to keep the most latency-sensitive component off swap even if
# OrbStack re-enables it.
etcd_deployment_type: host

# supplementary_addresses_in_ssl_keys (group_vars/all/all.yml) seeds the APISERVER
# certificate only -- roles/etcd/templates/openssl.conf.j2 builds its own alt_names
# from the etcd group's addresses plus etcd_cert_alt_ips, and never reads it. Without
# this an etcd member whose DHCP lease moves presents a certificate that no longer
# covers its address, and peer TLS fails.
#
# Derived at run time rather than listed: these addresses drift (five of six moved
# on 2026-09-27), so any literal list is stale the day after it is written. All six
# nodes are covered so the set still holds if a worker is ever promoted to etcd.
etcd_cert_alt_ips: >-
  {{ (groups['k8s_cluster'] | default([])
      | map('extract', hostvars)
      | map(attribute='ansible_default_ipv4.address', default='')
      | reject('equalto', '') | list) | unique }}

# Left at Kubespray's default of unlimited, which is what it resolves to on these
# 42G nodes. The 512M cap only applies to hosts under 4G.
etcd_memory_limit: 0

# Three members already tolerate one failure; a separate events cluster would add a
# second etcd to operate for no benefit at this size.
etcd_events_cluster_enabled: false

# etcd_heartbeat_interval (250), etcd_election_timeout (5000),
# etcd_quota_backend_bytes (2G), etcd_compaction_retention (8) and etcd_metrics
# (basic) are deliberately left at their defaults. The default 250/5000 ratio is the
# tolerant one, which is what this bridged, jitter-prone network wants.

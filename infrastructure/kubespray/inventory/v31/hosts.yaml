---
# V31 cluster on OrbStack: 3 stacked control-plane/etcd nodes, 3 workers, all arm64.
#
# ansible_host -> SSH transport only (OrbStack host-side proxy names, port 22).
# ip           -> deliberately NOT set. Kubespray falls back to each node's
#                 ansible_default_ipv4.address, which is gathered at run time.
#                 These addresses are DHCP with 1-day leases and OrbStack offers no
#                 static-IP facility: on 2026-09-27 five of the six moved by +1
#                 within a day. A hard-coded `ip:` is therefore a stale value
#                 waiting to happen, and it feeds kubelet --node-ip, the apiserver
#                 advertise address, etcd peer URLs and every generated cert SAN.
#                 Each machine has exactly one non-loopback interface (eth0), so
#                 fact gathering cannot pick the wrong one.
#                 Run scripts/ip-drift.sh to see what the cluster currently believes.
# access_ip    -> also unset; it defaults to the same address.
all:
  vars:
    ansible_user: wangxiang
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.orbstack/ssh/id_ed25519
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    cp1:
      ansible_host: cp1.orb.local
      etcd_member_name: etcd1
    cp2:
      ansible_host: cp2.orb.local
      etcd_member_name: etcd2
    cp3:
      ansible_host: cp3.orb.local
      etcd_member_name: etcd3
    w1:
      ansible_host: w1.orb.local
    w2:
      ansible_host: w2.orb.local
    w3:
      ansible_host: w3.orb.local
  children:
    kube_control_plane:
      hosts:
        cp1: {}
        cp2: {}
        cp3: {}
    etcd:
      hosts:
        cp1: {}
        cp2: {}
        cp3: {}
    kube_node:
      hosts:
        w1: {}
        w2: {}
        w3: {}
    # Declared explicitly so group_vars/k8s_cluster/ loads at inventory parse time
    # instead of relying on the runtime group_by in roles/dynamic_groups. That also
    # lets playbooks/orbstack-prepare.yml target k8s_cluster outside Kubespray.
    k8s_cluster:
      children:
        kube_control_plane: {}
        kube_node: {}

---
# Optional. Makes every node ARP-probe its DHCP offer and decline an address that
# is already in use, so a node can never be handed the kube-vip VIP.
#
#   bin/kubespray.sh playbooks/kube-vip-dhcp-guard.yml
#
# Why this is needed: OrbStack's DHCP server owns all of 192.168.139.0/24, ignores
# the client's Requested-IP option and does not probe for conflicts, so the VIP
# cannot be reserved. It does honour DHCPDECLINE and then offers the next address
# (measured: declined .208, was offered .209), which is what makes this work.
#
# Takes effect on the next DHCP ACK - lease renewal (T1 is 12h) or reboot - so
# running it changes nothing immediately. It protects a node acquiring a lease
# while the VIP is being advertised; it cannot help if the cluster is down.
#
# Scope: this stops a node TAKING an address something else is already answering
# for. It does nothing about a node being handed a different free address, which is
# what moved five of six on 2026-09-27 - see docs/ip-drift.md.
#
# Verified 2026-09-27 on w3, systemd 259: netplan renders its unit into
# /run/systemd/network/10-netplan-eth0.network, and a drop-in under /etc still
# applies to it - networkd logged "Reconfiguring with /run/.../10-netplan-eth0.network
# (dropins: /etc/systemd/network/10-netplan-eth0.network.d/10-v31-dhcp-decline.conf)".
# Note that the `networkctl reload` below re-runs DHCP, which is itself a chance for
# the address to move: run this before cluster.yml, not after.
- name: Decline DHCP offers that collide with an in-use address
  hosts: k8s_cluster
  become: true
  gather_facts: false
  vars:
    kube_vip_guard_interface: eth0
  tasks:
    - name: Find the .network unit configuring the interface
      ansible.builtin.command: networkctl status {{ kube_vip_guard_interface }}
      register: kube_vip_networkctl
      changed_when: false

    - name: Extract its file name
      ansible.builtin.set_fact:
        kube_vip_network_unit: >-
          {{ (kube_vip_networkctl.stdout
              | regex_search('Network File:\s*(\S+)', '\1')
              | default([], true) | first | default('')) | basename }}

    - name: Fail when no .network unit owns the interface
      ansible.builtin.assert:
        that:
          - kube_vip_network_unit is match('.*\.network$')
        fail_msg: >-
          networkctl reports no .network unit for {{ kube_vip_guard_interface }}
          ({{ kube_vip_network_unit | default('none') }}); this node is not managed
          by systemd-networkd and needs its own guard.

    - name: Create the drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/network/{{ kube_vip_network_unit }}.d
        state: directory
        mode: "0755"

    - name: Install the drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/network/{{ kube_vip_network_unit }}.d/10-v31-dhcp-decline.conf
        mode: "0644"
        content: |
          # Managed by infrastructure/kubespray/playbooks/kube-vip-dhcp-guard.yml
          # RFC 5227 probe the offered address; DHCPDECLINE it if something answers.
          [DHCPv4]
          SendDecline=yes
      register: kube_vip_dropin

    - name: Reload systemd-networkd
      ansible.builtin.command: networkctl reload
      when: kube_vip_dropin is changed
      changed_when: true

    - name: Confirm the interface still holds its address
      ansible.builtin.command: ip -4 -o addr show {{ kube_vip_guard_interface }}
      register: kube_vip_addr_after
      changed_when: false
      failed_when: "'192.168.139.' not in kube_vip_addr_after.stdout"

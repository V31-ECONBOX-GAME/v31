---
# Run before cluster.yml, and again after any node reboot that bypasses the unit.
#
# Covers the one thing Kubespray cannot: swap created at the OrbStack VM layer,
# outside the guest's control. The other OrbStack quirk - a read-only
# /etc/resolv.conf - is handled by resolvconf_mode: none in group_vars/all/all.yml.
- name: Prepare OrbStack machines for Kubespray
  hosts: k8s_cluster
  become: true
  gather_facts: true
  tasks:
    # hosts.yaml deliberately carries no literal `ip:` -- these addresses are DHCP
    # and five of six moved on 2026-09-27. Kubespray derives main_ip from
    # ansible_default_ipv4.address, so assert THAT is sane rather than comparing
    # against a number nobody maintains.
    - name: Assert the derived node address is usable
      ansible.builtin.assert:
        that:
          - ansible_facts['default_ipv4'] is defined
          - ansible_facts['default_ipv4']['address'] is defined
          - ansible_facts['default_ipv4']['address'] is match('192\\.168\\.139\\.')
        fail_msg: >-
          {{ inventory_hostname }} has no usable default IPv4 on the cluster segment
          (default_ipv4={{ ansible_facts['default_ipv4'] | default('none') }},
          all={{ ansible_facts['all_ipv4_addresses'] | default([]) | join(', ') }}).
          Kubespray would derive the wrong node address. Check the machine's network
          before deploying; see docs/ip-drift.md.
        success_msg: >-
          {{ inventory_hostname }} -> {{ ansible_facts['default_ipv4']['address'] }}
          on {{ ansible_facts['default_ipv4']['interface'] }}

    - name: Install durable swapoff unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/v31-swapoff.service
        mode: "0644"
        content: |
          [Unit]
          Description=Disable swap for Kubernetes (OrbStack re-creates it at boot)
          After=local-fs.target
          Before=kubelet.service containerd.service etcd.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/sbin/swapoff -a
          ExecStop=/bin/true

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and run swapoff unit
      ansible.builtin.systemd_service:
        name: v31-swapoff.service
        enabled: true
        state: started
        daemon_reload: true

    # OrbStack activates zram0 and /dev/vdc outside systemd, so the unit above can
    # lose the race on boot. kubelet_fail_swap_on: false is what keeps that from
    # wedging the node; these drop-ins keep the host services off swap regardless.
    - name: Create systemd drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        mode: "0755"
      loop: &v31_host_services
        - etcd.service
        - kubelet.service
        - containerd.service

    - name: Keep host services off swap
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.d/10-v31-noswap.conf"
        mode: "0644"
        content: |
          [Service]
          MemorySwapMax=0
      loop: *v31_host_services
      notify: Reload systemd

    - name: Confirm swap is off
      ansible.builtin.command: /sbin/swapon --noheadings --show
      register: v31_swap
      changed_when: false
      failed_when: v31_swap.stdout | trim | length > 0

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

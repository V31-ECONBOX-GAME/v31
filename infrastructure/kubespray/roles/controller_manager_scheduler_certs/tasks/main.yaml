- name: Create the Kubernetes certificate directory
  file:
    path: /etc/kubernetes/ssl
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check the Kubernetes root CA certificate
  stat:
    path: /etc/kubernetes/ssl/ca.crt
  delegate_to: "{{ groups['kube_control_plane'][0] }}"
  run_once: true
  register: kube_root_ca_file

- name: Create the Kubernetes root CA
  when: not kube_root_ca_file.stat.exists
  delegate_to: "{{ groups['kube_control_plane'][0] }}"
  run_once: true
  block:
    - name: Create the Kubernetes root CA private key
      community.crypto.openssl_privatekey:
        path: /etc/kubernetes/ssl/ca.key
        type: ECC
        curve: secp256r1
        mode: "0600"
    - name: Create the Kubernetes root CA signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: /etc/kubernetes/ssl/ca.key
        common_name: kubernetes
        use_common_name_for_san: false
        basic_constraints:
          - CA:TRUE
        basic_constraints_critical: true
        key_usage:
          - digitalSignature
          - keyEncipherment
          - keyCertSign
        key_usage_critical: true
      register: kube_root_ca_csr
    - name: Create the Kubernetes root CA certificate
      community.crypto.x509_certificate:
        path: /etc/kubernetes/ssl/ca.crt
        csr_content: "{{ kube_root_ca_csr.csr }}"
        privatekey_path: /etc/kubernetes/ssl/ca.key
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

- name: Issue the controller-manager and scheduler certificates
  include_tasks: issue.yaml
  loop: "{{ controller_manager_scheduler_certs }}"
  loop_control:
    loop_var: cert

---
# Applied first, before any workload and before any waypoint binding exists.
#
# Nothing here names a waypoint: istio.io/use-waypoint lives on the echo Service in
# workloads.yaml, which install.yml applies only after the Deployment below is ready.
# A binding that names a waypoint which does not exist yet leaves every Service in
# the namespace with an unresolvable reference for as long as it takes the workloads
# to roll out, so the waypoint is created first and waited for.
apiVersion: v1
kind: Namespace
metadata:
  name: v31-demo
  labels:
    # L4: every pod in this namespace is captured by the node ztunnel.
    istio.io/dataplane-mode: ambient
    # Lets the edge Gateway's allowedRoutes selector accept HTTPRoutes from here.
    v31.org/expose-via-edge: "true"
---
# The waypoint. This Deployment is Envoy; istiod provisions it from this Gateway and
# names it after the Gateway alone -- the istio-waypoint GatewayClass sets
# DisableNameSuffix, unlike the istio class which appends "-istio".
#
# waypoint-for=service (the default) means only Service-addressed traffic transits
# it; pod-IP traffic does not, which is what makes the L4 policy in mesh.yaml the
# thing that closes the bypass.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: v31-demo-waypoint
  namespace: v31-demo
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE

---
# Workloads only. The Namespace and the waypoint are in namespace.yaml, applied and
# waited for first, so the istio.io/use-waypoint label below always resolves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v1
  namespace: v31-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: echo, version: v1}
  template:
    metadata:
      labels: {app: echo, version: v1}
    spec:
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.11.0
          args: ["--port=8080", "--name=echo-v1"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: ["ALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v2
  namespace: v31-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo, version: v2}
  template:
    metadata:
      labels: {app: echo, version: v2}
    spec:
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.11.0
          args: ["--port=8080", "--name=echo-v2"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: ["ALL"]}
---
# Aggregate Service: the HTTPRoute parent and the only waypoint-bound Service here.
#
# The binding is on this Service rather than on the Namespace deliberately. A
# namespace-wide binding would also bind echo-v1 and echo-v2, which are the
# waypoint's own backends, so every request would be a candidate for a second
# waypoint hop. Binding the aggregate Service gives exactly one L7 hop:
#   client -> ztunnel -> waypoint (routes + L7 authz) -> ztunnel -> echo pod
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: v31-demo
  labels:
    # L7: Service-addressed traffic to `echo` transits the waypoint.
    istio.io/use-waypoint: v31-demo-waypoint
    # And so does traffic arriving from a Gateway, so the L7 AuthorizationPolicy
    # attached to the waypoint also covers north-south requests. Istio requires
    # istio.io/use-waypoint alongside this label.
    istio.io/ingress-use-waypoint: "true"
spec:
  selector: {app: echo}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
# Version Services: HTTPRoute backends, deliberately NOT waypoint-bound.
apiVersion: v1
kind: Service
metadata:
  name: echo-v1
  namespace: v31-demo
spec:
  selector: {app: echo, version: v1}
  ports: [{name: http, port: 8080, targetPort: 8080, appProtocol: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: echo-v2
  namespace: v31-demo
spec:
  selector: {app: echo, version: v2}
  ports: [{name: http, port: 8080, targetPort: 8080, appProtocol: http}]
---
# In-mesh client, for proving mTLS and L7 policy from inside the namespace.
# Runs as the namespace's default ServiceAccount, which is the principal the L7
# AuthorizationPolicy in mesh.yaml allows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: v31-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
        - name: curl
          image: docker.io/curlimages/curl:8.19.0
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric UID is required: curlimages/curl declares USER as the NAME
            # "curl_user", and with runAsNonRoot the kubelet refuses a non-numeric
            # user it cannot prove is non-root -- CreateContainerConfigError, not a
            # crash, so the pod never starts and the rollout wait times out.
            # Measured from the image: uid=100(curl_user) gid=101(curl_group).
            runAsUser: 100
            runAsGroup: 101
            capabilities: {drop: ["ALL"]}

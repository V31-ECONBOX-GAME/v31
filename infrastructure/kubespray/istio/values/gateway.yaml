---
# istio/gateway 1.31.1 - statically managed ingress Deployment.
# Not installed by default: the Gateway API path in manifests/ingress-gateway.yaml
# provisions the same data plane from the Gateway resource. Enable with
# istio_install_gateway_chart=true if a Helm-owned Deployment is required instead.
# The chart already labels its pods istio.io/dataplane-mode=none.

service:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
      nodePort: 30021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30080

# Fixed replicas; the chart enables an HPA by default, which would override this.
autoscaling:
  enabled: false
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podDisruptionBudget:
  minAvailable: 1

terminationGracePeriodSeconds: 30

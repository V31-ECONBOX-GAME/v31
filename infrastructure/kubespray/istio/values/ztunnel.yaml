---
# istio/ztunnel 1.31.1 - node proxy DaemonSet. L4 only: mTLS, HBONE, L4 authorization.
# This chart reads hub/tag/variant at the top level, not under global.
profile: ambient
hub: docker.io/istio
tag: 1.31.1
variant: distroless

logLevel: info
logAsJson: true

istioNamespace: istio-system

# Upstream defaults (200m/512Mi) are sized for ~200k pods. Six nodes need far less,
# and 100m keeps the two vCPU control-plane nodes comfortable.
#
# The memory limit is new and is the point: these machines are cgroup-limited
# containers whose /proc/meminfo reports the whole 42GiB VM, so kubelet never sees
# the 4GiB cap and never evicts. A per-container limit is the only thing that makes
# the kernel kill a runaway ztunnel by name instead of picking a victim on the node.
# 512Mi is ~6x the measured idle footprint at this size.
#
# No CPU limit: ztunnel is on the data path for every enrolled pod on the node, and
# a throttled ztunnel stalls connections rather than slowing them.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Never take two node proxies down at once.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

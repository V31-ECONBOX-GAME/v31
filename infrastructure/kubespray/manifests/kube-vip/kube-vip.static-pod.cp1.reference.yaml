# Reference rendering of /etc/kubernetes/manifests/kube-vip.yml as Kubespray v2.32.0
# produces it on cp1 from group_vars/all/kube-vip.yml. Kubespray owns the real file;
# this copy exists to review and diff it. Note "True"/"False" -- Ansible's string
# filter yields Python casing, which Go's strconv.ParseBool accepts.
#
# On cp2 and cp3, and on cp1 after the first kubeadm init, only two things differ:
#   vip_nodename      -> cp2 / cp3
#   volumes[0].path   -> /etc/kubernetes/admin.conf
---
apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
    k8s-app: kube-vip
spec:
  containers:
  - args:
    - manager
    env:
    - name: vip_arp
      value: "True"
    - name: port
      value: "6443"
    - name: vip_nodename
      value: cp1
    - name: vip_interface
      value: "eth0"
    - name: vip_servicesinterface
      value: "eth0"
    - name: vip_subnet
      value: "32"
    - name: dns_mode
      value: "first"
    - name: cp_enable
      value: "true"
    - name: cp_namespace
      value: kube-system
    - name: vip_ddns
      value: "False"
    - name: cp_detect
      value: "False"
    - name: svc_enable
      value: "true"
    - name: svc_leasename
      value: "plndr-svcs-lock"
    - name: vip_leaderelection
      value: "true"
    - name: vip_leasename
      value: "plndr-cp-lock"
    - name: vip_leaseduration
      value: "15"
    - name: vip_renewdeadline
      value: "10"
    - name: vip_retryperiod
      value: "2"
    - name: enable_node_labeling
      value: "True"
    - name: address
      value: "192.168.139.240"
    - name: lb_fwdmethod
      value: "local"
    - name: prometheus_server
      value: ":2112"
    image: ghcr.io/kube-vip/kube-vip:v1.2.4
    imagePullPolicy: IfNotPresent
    name: kube-vip
    resources: {}
    ports:
    - name: metrics
      containerPort: 2112
      protocol: TCP
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
        - NET_RAW
        drop:
        - ALL
    volumeMounts:
    - mountPath: /etc/kubernetes/admin.conf
      name: kubeconfig
  hostAliases:
  - hostnames:
    - kubernetes
    ip: 127.0.0.1
  hostNetwork: true
  priority: 2000001000
  volumes:
  - hostPath:
      path: /etc/kubernetes/super-admin.conf
    name: kubeconfig
status: {}

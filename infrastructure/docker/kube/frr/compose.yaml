services:
  frr:
    image: quay.io/frrouting/frr:10.7.1
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - systempaths=unconfined
    command: ["sh", "-c", "sysctl -p && exec /usr/lib/frr/docker-start"]
    volumes:
      - ./daemons:/etc/frr/daemons:ro
      - ./frr.conf:/etc/frr/frr.conf:ro
      - ./sysctl.conf:/etc/sysctl.conf:ro
